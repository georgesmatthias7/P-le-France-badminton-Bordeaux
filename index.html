<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Performance — Suivi des séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121820;--ink2:#28313c;--paper:#f3f1ec;--card:#fff;--line:#e3dfd6;--line2:#eeebe4;--muted:#6a6f78;--soft:#f8f7f3;
  --match:#d64527;--match-s:#fbe9e3;--ent:#2458c8;--ent-s:#e6edfc;--prepa:#0d8a61;--prepa-s:#e0f3eb;
  --hr:#d64527;--acc:#2458c8;--vid:#7a4fd0;--ok:#0d8a61;--warn:#c98a0b;
  --r:14px;--sh:0 1px 2px rgba(18,24,32,.05),0 8px 28px -14px rgba(18,24,32,.22);
  --mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Barlow Condensed',Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--ink);color:#d9dde3;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;margin:0 8px 26px}
.brand .mk{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#d64527 0%,#ef8a3a 100%);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 21px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;color:#fff}
.brand small{display:block;font-size:10.5px;color:#8b93a0;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f7885;margin:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#c3c9d2;text-decoration:none;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a:hover{background:#1c2430;color:#fff}
.nav a.on{background:#fff;color:var(--ink)}
.nav a .cnt{margin-left:auto;font:500 11px var(--mono);opacity:.65}
.side .foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid #222b37;font-size:12px;color:#8b93a0}
.side .foot b{color:#e7eaee;font-weight:600}
.undo{display:flex;gap:6px;margin:10px 0 2px}
.undo button{flex:1;background:#1c2430;border:1px solid #2a3442;color:#d9dde3;border-radius:8px;padding:7px 8px;font-size:12px;cursor:pointer}
.undo button:disabled{opacity:.35;cursor:default}
.undo button:not(:disabled):hover{background:#263040}
main{padding:30px 38px 70px;min-width:0}
/* Typo */
.eyebrow{font:600 11px/1.2 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1.t{font:700 38px/1 var(--disp);text-transform:uppercase;letter-spacing:.015em;margin:6px 0 0}
h2.t{font:700 22px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3.t{font:600 13px/1.2 Inter;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink2)}
.sub{color:var(--muted);margin-top:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.ph .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft);border-color:#d3cec3}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#26303c}
.btn.danger{color:#b4321a}
.btn.danger:hover{background:#fdf0ec;border-color:#f0c4b8}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ic{padding:6px 8px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}
.link{background:none;border:0;padding:0;color:var(--acc);cursor:pointer;font-weight:600}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,24,32,.08)}
label.l{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.fld{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--sh)}
.kpi{padding:14px 18px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:600 24px/1.1 var(--mono);margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font:500 12px Inter;color:var(--muted);margin-left:3px;letter-spacing:0}
/* Category */
.cat{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.cat i{width:7px;height:7px;border-radius:50%;background:currentColor}
.cat.match{background:var(--match-s);color:var(--match)}
.cat.entrainement{background:var(--ent-s);color:var(--ent)}
.cat.prepa{background:var(--prepa-s);color:var(--prepa)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* Players grid */
.search{position:relative}
.search input{padding-left:34px;width:240px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.teamstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.tcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--ink))}
.tcard .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tcard .v{font:700 34px/1 var(--disp);margin-top:8px}
.tcard .s{font-size:12px;color:var(--muted);margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);border-color:#cfc9bd;box-shadow:0 2px 4px rgba(18,24,32,.05),0 16px 32px -16px rgba(18,24,32,.3)}
.pc-top{display:flex;gap:13px;align-items:center}
.av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 19px/1 var(--disp);letter-spacing:.04em;color:#fff;background:hsl(var(--h,210) 35% 28%);flex:none}
.av.lg{width:72px;height:72px;border-radius:18px;font-size:30px}
.pn{font:700 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.pm{font-size:12px;color:var(--muted);margin-top:4px}
.split{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--line2);margin:16px 0 10px;gap:2px}
.split span{display:block;height:100%}
.pcounts{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.pcounts span{display:flex;align-items:center;gap:5px}
.pcounts b{font:600 13px var(--mono)}
.pcounts i{width:7px;height:7px;border-radius:50%}
.plast{font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.empty{text-align:center;padding:56px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.5)}
.empty b{display:block;color:var(--ink);font:700 22px var(--disp);text-transform:uppercase;margin-bottom:6px;letter-spacing:.02em}
/* Player page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:14px}
.back:hover{color:var(--ink)}
.phero{display:flex;gap:20px;align-items:center}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:26px}
.col{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.colh{padding:16px 18px 14px;border-bottom:1px solid var(--line2);position:relative}
.colh:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.colh .ttl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.colh h2{font:700 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--c)}
.colh .meta{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.colh .meta b{font:600 15px var(--mono);color:var(--ink);display:block}
.colb{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.srow{display:block;text-decoration:none;padding:11px 12px;border-radius:10px;border:1px solid transparent}
.srow:hover{background:var(--soft);border-color:var(--line2)}
.srow .a{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.srow .ti{font-weight:600}
.srow .d{font-size:12px;color:var(--muted);white-space:nowrap}
.srow .b{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--ink2);align-items:center;flex-wrap:wrap}
.srow .b .num{font-size:12px}
.tags{display:flex;gap:4px;margin-left:auto}
.tag{font:600 9.5px/1 Inter;letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--line2);color:#9aa0a8}
.tag.on.hr{background:var(--match-s);color:var(--hr)}
.tag.on.acc{background:var(--ent-s);color:var(--acc)}
.tag.on.vid{background:#efe9fb;color:var(--vid)}
.colempty{color:var(--muted);font-size:12.5px;text-align:center;padding:26px 10px}
/* Tables */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tb td{white-space:nowrap;padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover td{background:var(--soft)}
.tb td.r,.tb th.r{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:7px}
.tbwrap{overflow:auto}
/* Session */
.shead{margin-bottom:18px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button i{width:7px;height:7px;border-radius:50%}
.seg button.on{background:var(--c,var(--ink));color:#fff}
.seg button.on i{background:#fff!important}
.zones{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:12px;font:600 10.5px/26px Inter;color:#fff;letter-spacing:.04em}
.zones span{text-align:center;white-space:nowrap;overflow:hidden;min-width:0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.charts{padding:6px 0 10px}
.ctool{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ctool .rd{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.ctool .rd b{color:var(--ink);font-weight:600}
.trk{position:relative;padding:0 4px}
.trk .tl{position:absolute;left:52px;top:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:1;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:4px}
.trk .tl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.trk canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.trk.lanes canvas{cursor:pointer}
.trk.ov canvas{cursor:grab}
.hint{font-size:11.5px;color:var(--muted);padding:6px 18px 0}
.sidep{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.vwrap{background:#0b0f14;border-radius:var(--r) var(--r) 0 0;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.vwrap video{width:100%;height:100%;display:block;background:#000}
.vdrop{color:#9aa3ae;text-align:center;font-size:12.5px;padding:20px}
.vdrop b{display:block;color:#fff;font:700 18px var(--disp);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.vbar{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line2)}
.vbar .vt{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
.af{padding:16px 18px}
.af .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.af .rg{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}
.af .rg .du{font:500 12px var(--mono);color:var(--muted);padding-bottom:9px;white-space:nowrap}
.lsel{display:flex;gap:6px;margin-bottom:12px}
.lsel button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.lsel button i{width:8px;height:8px;border-radius:2px}
.lsel button.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.astats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.astats div{background:var(--soft);border-radius:9px;padding:8px 10px}
.astats .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.astats .v{font:600 15px var(--mono);margin-top:2px}
.cutbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.afh{font-size:12.5px;color:var(--muted);line-height:1.55}
.afh ol{padding-left:18px;margin:8px 0 0}
.afh li{margin-bottom:4px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.dcell{padding:18px 20px;border-right:1px solid var(--line2)}
.dcell:last-child{border-right:0}
.dcell .h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.dcell .h i{width:10px;height:10px;border-radius:3px}
.dcell .st{font-size:12.5px;color:var(--muted);margin-bottom:12px;min-height:38px}
.dcell .st b{color:var(--ink);font-weight:600}
.dcell .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.offs{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--muted)}
.offs input{width:90px;padding:5px 8px;font-family:var(--mono);font-size:12px}
.qual{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--prepa-s);color:var(--ok)}
.qual.w{background:#fbf1dc;color:var(--warn)}
/* Modal */
#modal{position:fixed;inset:0;display:none;z-index:50}
#modal.on{display:block}
.mbg{position:absolute;inset:0;background:rgba(14,18,24,.5);backdrop-filter:blur(2px)}
.mbox{position:relative;margin:6vh auto;max-width:520px;width:calc(100% - 32px);background:#fff;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);max-height:88vh;overflow:auto}
.mbox.wide{max-width:900px}
.mh{padding:22px 24px 4px}
.mh h2{font:700 26px/1.05 var(--disp);text-transform:uppercase;margin:6px 0 0;letter-spacing:.02em;word-break:break-word}
.mb{padding:16px 24px}
.mf{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catpick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;cursor:pointer;text-align:left;transition:all .12s}
.catpick button b{display:block;font:700 17px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;color:var(--c)}
.catpick button span{font-size:11.5px;color:var(--muted);display:block;margin-top:5px}
.catpick button.on{border-color:var(--c);background:var(--cs);box-shadow:inset 0 0 0 1px var(--c)}
.impgrid{display:grid;grid-template-columns:260px 1fr;gap:22px}
.impgrid canvas{width:100%;height:190px;display:block;border:1px solid var(--line2);border-radius:10px;background:var(--soft)}
.ist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ist div{background:var(--soft);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.ist b{display:block;font:600 15px var(--mono);color:var(--ink)}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:9px;padding:10px 12px;line-height:1.5}
.note.w{background:#fbf1dc;color:#7a5406}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px;cursor:pointer}
.prog{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:10px}
.prog span{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
/* Toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 40px -10px rgba(0,0,0,.5);font-size:13px;pointer-events:auto;animation:tin .18s ease-out}
.tst.err{background:#8f2410}
.tst button{background:#2b3542;border:0;color:#fff;border-radius:8px;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.banner{background:#fbf1dc;color:#7a5406;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.trash-it{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.trash-it:last-child{border-bottom:0}
.trash-it .w{flex:1;min-width:0}
.trash-it .w b{display:block}
.trash-it .w span{font-size:12px;color:var(--muted)}
.typ{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line2)}
.typ:last-child{border-bottom:0}
.typ input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.typ input.f{max-width:340px}
.req{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:flex-start}
.req:last-child{border-bottom:0}
.req .w{flex:1}
.req .m{font-size:12px;color:var(--muted);margin-top:4px}
.req.done .tx{text-decoration:line-through;color:var(--muted)}

  function parseTable(text) {

  }
  function metaAbsStart(meta) {

    } else {

  const ac = sl(SP.data.acc, o.acc); if (ac.length) r.acc = ac.reduce((x, y) => x + y, 0) / ac.length;
  const pl = sl(SP.data.pl, o.acc); if (pl.length) { r.load = pl.reduce((x, y) => x + y, 0); r.loadMin = r.load / (r.dur / 60); }

/* ---------- découpe des données (garder une plage / effacer une plage) ---------- */
async function cutData(kinds, a, b, mode) {
  const s = curSess(); if (!s || !kinds.length) { toast('Cochez Cardio et/ou Accéléro', { err: true }); return; }
  const lbl = kinds.map(k => k === 'hr' ? 'cardio' : 'accéléro').join(' + ');
  const ok = await confirmBox(mode === 'keep' ? 'Garder seulement cette plage ?' : 'Effacer cette plage ?',
    (mode === 'keep' ? `Les données ${lbl} avant ${fmtClock(a)} et après ${fmtClock(b)} seront retirées.` : `Les données ${lbl} entre ${fmtClock(a)} et ${fmtClock(b)} seront vidées.`) + ' Vous pourrez revenir en arrière avec « Annuler ».', mode === 'keep' ? 'Couper' : 'Effacer', true);
  if (!ok) return;

  const slice = (ser, off, dt) => { const n = ser.length; const i0 = Math.max(0, Math.floor((a - off) / dt)), i1 = Math.min(n, Math.ceil((b - off) / dt)); if (i1 <= i0) return null;

  const fin = v => Array.from(v).filter(Number.isFinite);
  for (const k of kinds) {
    const meta = d[k]; const ser = SP.data[k]; if (!meta || !ser) continue;
    const off = meta.offset || 0; const r = slice(ser.v, off, ser.dt);
    if (!r) { toast('La plage ne contient pas de données ' + (k === 'hr' ? 'cardio' : 'accéléro'), { err: true }); return; }
    const vals = fin(r.v);
    if (!vals.length) { toast('Il ne resterait aucune donnée : utilisez plutôt « Retirer » dans Données & synchronisation', { err: true }); return; }

    } else {
      const pl = SP.data.pl ? slice(SP.data.pl.v, off, 1) : null;
      meta.chunks = chunkify(r.v, 'acc', 3, meta.chunks); meta.n = r.v.length;
      if (pl) { meta.plChunks = chunkify(pl.v, 'pl', 2, meta.plChunks); }
      const load = pl ? fin(pl.v).reduce((x, y) => x + y, 0) : (meta.summary && meta.summary.load) || 0;
      meta.dur = Math.round(r.v.length * ser.dt);
      meta.summary = { mean: vals.reduce((x, y) => x + y, 0) / vals.length, peak: P.quantile(vals, 0.99), load, loadMin: meta.dur > 0 ? load / (meta.dur / 60) : null };
    }

}

async function openImport(kind, file) {

  catch (e) { setTimeout(() => { const x = $('#impErrX'); if (x) x.onclick = closeModal; }); $('#impBody').innerHTML = `<div class="note w">Impossible de lire ce fichier : ${esc(e.message)}</div><div class="mf" style="border:0;padding:16px 0 0"><button class="btn" id="impErrX">Fermer</button></div>`; return; }

  d.video = { name: file.name, size: file.size, type: file.type || 'video/mp4', mode: 'local', offset: d.video ? d.video.offset || 0 : 0, link: d.video ? d.video.link || '' : '', duration: null, addedAt: Date.now(), addedBy: S.meId };
  SP.vKey = null;
  try { await changeMany('Vidéo associée : ' + file.name, [{ path: 'sessions/' + id, data: d }]); } catch (e) { }
}
async function setVideoLink(val) {
  const s = curSess(); if (!s || !s.video) return; val = String(val || '').trim();
  if (val && !/^https?:\/\//i.test(val)) { toast('Le lien doit commencer par https://', { err: true }); renderDataPanel(); return; }
  await patch(val ? 'Lien de la vidéo enregistré' : 'Lien de la vidéo retiré', 'sessions/' + s.id, { video: Object.assign(clone(s.video), { link: val }) });
}

/* =====================================================================
   COMPTES & BASE DE DONNÉES (Supabase)
   La couche ci-dessous expose la même interface que l'application attend
   (doc / collection / onSnapshot), stockée dans la table « docs ».
   ===================================================================== */
const CFG = window.APP_CONFIG || {};
const A = { sb: null, session: null, profile: null, listeners: new Set() };
const ROLES = { pending: 'En attente', viewer: 'Lecteur', coach: 'Coach', admin: 'Administrateur' };

function pgErr(e) {
  if (!e) return null; const m = e.message || String(e);
  let code = 'unavailable';
  if (e.code === '42501' || /row-level security|permission denied/i.test(m)) code = 'invalid_argument';
  else if (/JWT|token/i.test(m)) code = 'revoked';
  else if (/too large|payload/i.test(m)) code = 'invalid_argument';
  else if (e.code === '53100' || /quota|disk|read-only/i.test(m)) code = 'quota_exceeded';
  return { code, message: m };
}
function makeDb() {
  const sb = A.sb;
  const snapDoc = (path, data) => ({ id: path.split('/').pop(), exists: data != null, data: () => data == null ? undefined : data, metadata: { fromCache: false, hasPendingWrites: false } });
  const matches = (data, filters) => filters.every(([f, op, v]) => op === '==' ? data && data[f] === v : true);
  const localEmit = (path, data) => { const col = path.split('/')[0]; A.listeners.forEach(l => { if (l.col === col) l.local(path, data); }); };
  const docRef = path => ({
    id: path.split('/').pop(), path,
    async get() { const { data, error } = await sb.from('docs').select('data').eq('path', path).maybeSingle(); if (error) throw pgErr(error); return snapDoc(path, data ? data.data : null); },
    async set(d) { const { error } = await sb.from('docs').upsert({ path, col: path.split('/')[0], data: d, updated_by: A.session.user.id }); if (error) throw pgErr(error); localEmit(path, d); },
    async update(d) { const cur = await this.get(); if (!cur.exists) throw { code: 'invalid_argument', message: 'Document absent' }; await this.set(Object.assign(cur.data(), d)); },
    async delete() { const { error } = await sb.from('docs').delete().eq('path', path); if (error) throw pgErr(error); localEmit(path, null); },
    onSnapshot(next, err) { let dead = false; const go = () => this.get().then(s => { if (!dead) next(s); }, e => err && err(e)); go(); const iv = setInterval(go, 30000); return () => { dead = true; clearInterval(iv); }; },
    collection(sub) { return query(path + '/' + sub); }
  });
  const query = (col, filters = [], lim = 0) => {
    const run = async () => {
      const out = []; const PAGE = 1000;
      for (let from = 0; ; from += PAGE) {
        let q = sb.from('docs').select('path,data').eq('col', col).order('path');
        for (const [f, op, v] of filters) if (op === '==') q = q.eq('data->>' + f, String(v));
        const to = lim ? Math.min(lim, from + PAGE) - 1 : from + PAGE - 1;
        const { data, error } = await q.range(from, to); if (error) throw pgErr(error);
        out.push(...data); if (data.length < PAGE || (lim && out.length >= lim)) break;
      }
      return out;
    };
    const toSnap = rows => { const docs = rows.map(r => snapDoc(r.path, r.data)); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
    return {
      path: col,
      where: (f, op, v) => query(col, [...filters, [f, op, v]], lim),
      limit: n => query(col, filters, n),
      orderBy: () => query(col, filters, lim),
      doc: id => docRef(col + '/' + (id || uid())),
      add: async d => { const r = docRef(col + '/' + uid()); await r.set(d); return r; },
      get: async () => toSnap(await run()),
      onSnapshot(next, err) {
        let dead = false, t = null, rows = new Map(), fails = 0;
        const emit = () => { if (!dead) next(toSnap([...rows.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([path, data]) => ({ path, data })))); };
        const refresh = async () => {
          try { const r = await run(); fails = 0; rows = new Map(r.map(x => [x.path, x.data])); emit(); }
          catch (e) { if (dead) return; if (e.code === 'revoked' || e.code === 'invalid_argument') { err && err(e); return; } fails++; setTimeout(refresh, Math.min(30000, 2000 * fails)); }
        };
        const soon = () => { clearTimeout(t); t = setTimeout(refresh, 300); };
        const L = { col, local: (path, data) => { if (dead) return; if (data && matches(data, filters)) rows.set(path, data); else rows.delete(path); emit(); } };
        A.listeners.add(L);
        const ch = sb.channel('c-' + col + '-' + uid())
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'docs', filter: 'col=eq.' + col }, soon)
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'docs', filter: 'col=eq.' + col }, soon)
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'docs' }, p => { if (p.old && String(p.old.path || '').startsWith(col + '/')) soon(); })
          .subscribe(st => { if (st === 'SUBSCRIBED') soon(); });
        refresh();
        const iv = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 60000);
        return () => { dead = true; clearTimeout(t); clearInterval(iv); A.listeners.delete(L); try { sb.removeChannel(ch); } catch (e) { } };
      }
    };
  };
  return { doc: docRef, collection: c => query(c) };
}
function makeUser() {
  const role = () => (A.profile && A.profile.role) || 'pending';
  return {
    id: async () => A.session.user.id,
    me: async () => ({ id: A.session.user.id, name: (A.profile && A.profile.name) || '' }),
    isOwner: () => role() === 'admin',
    canEdit: () => role() === 'admin',
    can: async n => n === 'data.write' ? ['coach', 'admin'].includes(role()) : null,
    profiles: async ids => { const { data } = await A.sb.from('profiles').select('id,name').in('id', ids); const o = {}; (data || []).forEach(p => o[p.id] = { id: p.id, name: p.name }); return o; }
  };
}

/* ---------- écrans de connexion ---------- */
function authShell(inner) {
  document.body.classList.add('authmode');
  $('#auth').innerHTML = `<div class="au-side"><div class="brand"><div class="mk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></div><div><b>Lab Perf</b><small>Suivi des séances</small></div></div>
    <div class="au-pitch"><h1>Cardio, accéléromètre et vidéo,<br>réunis par séance.</h1><p>Profils joueurs, séances classées en match, entraînement et préparation physique, annotations partagées entre coachs.</p>
    <div class="au-tags"><span style="--c:var(--match)">Match</span><span style="--c:var(--ent)">Entraînement</span><span style="--c:var(--prepa)">Préparation physique</span></div></div></div>
    <div class="au-main"><div class="au-card">${inner}</div></div>`;
}
function hideAuth() { document.body.classList.remove('authmode'); $('#auth').innerHTML = ''; }
function authMsg(t, err) { const m = $('#auMsg'); if (m) { m.textContent = t; m.className = 'au-msg' + (err ? ' err' : ''); } }
function frErr(e) {
  const m = (e && e.message) || '';
  if (/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connectez-vous.';
  if (/at least 6|password should/i.test(m)) return 'Le mot de passe doit contenir au moins 6 caractères.';
  if (/Email not confirmed/i.test(m)) return 'E-mail non confirmé. Demandez à l’administrateur de désactiver la confirmation par e-mail (voir le guide).';
  if (/valid email|invalid.*email/i.test(m)) return 'Adresse e-mail invalide.';
  if (/fetch|network/i.test(m)) return 'Connexion impossible au serveur. Vérifiez internet, ou le projet Supabase est peut-être en veille (voir le guide).';
  return m || 'Erreur inattendue.';
}
function showAuth(mode) {
  if (mode === 'config') { authShell(`<h2>Configuration à terminer</h2><p class="au-p">Le fichier <b>config.js</b> ne contient pas encore l’adresse et la clé du projet Supabase. Suivez le guide d’installation (README).</p>`); return; }
  if (mode === 'pending') {
    authShell(`<div class="eyebrow">Compte créé</div><h2>En attente de validation</h2><p class="au-p">Bonjour ${esc((A.profile && A.profile.name) || '')}. Un administrateur doit valider votre accès. Cette page s’ouvrira automatiquement dès que ce sera fait.</p><button class="btn" id="auOut">Se déconnecter</button>`);
    $('#auOut').onclick = () => A.sb.auth.signOut();
    const iv = setInterval(async () => { const p = await fetchProfile(); if (p && p.role !== 'pending') { clearInterval(iv); location.reload(); } }, 8000);
    return;
  }
  const signup = mode === 'signup';
  authShell(`<div class="eyebrow">${signup ? 'Nouveau coach' : 'Bienvenue'}</div><h2>${signup ? 'Créer un compte' : 'Connexion'}</h2>
    <form id="auF">${signup ? `<div class="fld"><label class="l">Prénom et nom</label><input class="f" name="name" required autocomplete="name"></div>` : ''}
    <div class="fld"><label class="l">E-mail</label><input class="f" type="email" name="email" required autocomplete="email"></div>
    <div class="fld"><label class="l">Mot de passe</label><input class="f" type="password" name="pw" required minlength="6" autocomplete="${signup ? 'new-password' : 'current-password'}"></div>
    <div id="auMsg" class="au-msg"></div>
    <button class="btn pri" style="width:100%;justify-content:center;padding:11px" id="auGo">${signup ? 'Créer mon compte' : 'Se connecter'}</button></form>
    <p class="au-p" style="margin-top:18px;text-align:center">${signup ? 'Déjà un compte ? <button class="link" id="auSw">Se connecter</button>' : 'Pas encore de compte ? <button class="link" id="auSw">Créer un compte</button>'}</p>
    ${signup ? '<p class="au-p au-s">Après la création, un administrateur valide votre accès.</p>' : '<p class="au-p au-s">Mot de passe oublié ? Demandez à l’administrateur de le réinitialiser.</p>'}`);
  $('#auSw').onclick = () => showAuth(signup ? 'login' : 'signup');
  $('#auF').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const btn = $('#auGo'); btn.disabled = true; authMsg('');
    const email = String(f.get('email')).trim(), password = String(f.get('pw'));
    try {
      if (signup) {
        const { data, error } = await A.sb.auth.signUp({ email, password, options: { data: { name: String(f.get('name')).trim() } } });
        if (error) throw error;
        if (!data.session) { authMsg('Compte créé. Confirmez votre adresse via l’e-mail reçu, puis connectez-vous.'); btn.disabled = false; return; }
        await afterLogin(data.session);
      } else {
        const { data, error } = await A.sb.auth.signInWithPassword({ email, password }); if (error) throw error;
        await afterLogin(data.session);
      }
    } catch (x) { authMsg(frErr(x), true); btn.disabled = false; }
  };
}
async function fetchProfile() {
  const { data } = await A.sb.from('profiles').select('*').eq('id', A.session.user.id).maybeSingle(); return data || null;
}
let booted = false;
async function afterLogin(session) {
  A.session = session;
  let p = null; for (let i = 0; i < 4 && !p; i++) { p = await fetchProfile(); if (!p) await new Promise(r => setTimeout(r, 700)); }
  A.profile = p || { role: 'pending', name: '' };
  if (A.profile.role === 'pending') { showAuth('pending'); return; }
  hideAuth();
  if (booted) return; booted = true;
  window.claude = { use: async n => n === 'db' ? makeDb() : n === 'user' ? makeUser() : null };
  init();
}
async function boot() {
  if (!CFG.supabaseUrl || /VOTRE|xxxx/i.test(CFG.supabaseUrl) || !window.supabase) { showAuth('config'); return; }
  const sbUrl = String(CFG.supabaseUrl).trim().replace(/\/(rest|auth|realtime|storage)\/v1.*$/i, '').replace(/\/+$/, ''); // tolère une adresse copiée avec /rest/v1/
  A.sb = window.supabase.createClient(sbUrl, String(CFG.supabaseAnonKey).trim(), { auth: { persistSession: true, autoRefreshToken: true } });
  A.sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') { history.replaceState(null, '', location.pathname); location.reload(); } else if (s) A.session = s; });
  const { data: { session } } = await A.sb.auth.getSession();
  if (!session) { showAuth('login'); return; }
  try { await afterLogin(session); } catch (e) { showAuth('login'); }
}

/* ---------- page « Accès » (administrateurs) ---------- */
S.profiles = new Map();
function subProfiles() {
  const load = async () => { const { data } = await A.sb.from('profiles').select('*').order('created_at'); S.profiles = new Map((data || []).map(p => [p.id, p])); schedRender(); };
  load(); A.sb.channel('profiles-' + uid()).on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, load).subscribe();
}
function viewAccess() {
  if (!S.isOwner) return `<div class="empty"><b>Réservé aux administrateurs</b>Demandez à un administrateur de gérer les accès.</div>`;
  const ps = [...S.profiles.values()]; const pend = ps.filter(p => p.role === 'pending');
  const row = p => `<tr><td><b>${esc(p.name || '—')}</b>${p.id === S.meId ? ' <span class="muted">(vous)</span>' : ''}</td><td class="muted">${esc(p.email || '')}</td><td class="num muted">${new Date(p.created_at).toLocaleDateString('fr-FR')}</td>
    <td><select class="f" data-role="${p.id}" style="width:170px" ${p.id === S.meId ? 'disabled' : ''}>${Object.entries(ROLES).map(([k, l]) => `<option value="${k}" ${p.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td></tr>`;
  return `<div class="ph"><div><div class="eyebrow">Réglages</div><h1 class="t">Accès des coachs</h1><div class="sub">Envoyez le lien de l’application aux coachs : ils créent leur compte, puis vous leur donnez un rôle ici.</div></div>
    <div class="acts"><button class="btn" id="cpLink">Copier le lien de l’application</button></div></div>
    ${pend.length ? `<div class="banner">${pend.length} compte${pend.length > 1 ? 's' : ''} en attente de validation.</div>` : ''}
    <div class="card tbwrap"><table class="tb"><thead><tr><th>Nom</th><th>E-mail</th><th>Inscrit le</th><th>Rôle</th></tr></thead><tbody>${ps.map(row).join('')}</tbody></table></div>
    <div class="note" style="margin-top:14px"><b>Lecteur</b> : consulte tout, sans modifier. <b>Coach</b> : ajoute joueurs, séances, données, vidéos et annotations. <b>Administrateur</b> : comme un coach, et gère les accès. Remettre « En attente » retire l’accès.</div>`;
}
function bindAccess(m) {
  $$('[data-role]', m).forEach(s => s.onchange = async () => {
    const { error } = await A.sb.from('profiles').update({ role: s.value }).eq('id', s.dataset.role);
    if (error) toast('Modification refusée : ' + error.message, { err: true }); else { toast('Rôle mis à jour : ' + ROLES[s.value]); const p = S.profiles.get(s.dataset.role); if (p) p.role = s.value; }
  });
  const c = $('#cpLink', m); if (c) c.onclick = async () => { const u = location.origin + location.pathname; try { await navigator.clipboard.writeText(u); toast('Lien copié : ' + u); } catch (e) { toast(u); } };
}
boot();

</script>
